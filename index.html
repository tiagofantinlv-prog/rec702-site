
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REC702</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- Lenis -->
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

<style>
body { margin:0; font-family: Arial, sans-serif; background:#000; color:#fff; overflow:hidden; }

/* Preloader */
.preloader {
  position:fixed; inset:0; background:#000; display:flex;
  align-items:center; justify-content:center; z-index:9999;
}
.preloader h1 { font-size:28px; letter-spacing:6px; opacity:0; }

/* Cursor */
.cursor {
  position:fixed; width:18px; height:18px; border:1px solid #fff;
  border-radius:50%; pointer-events:none; transform:translate(-50%,-50%);
  z-index:9998;
}

/* Header */
.header {
  position:fixed; top:0; width:100%; display:flex;
  justify-content:space-between; padding:20px 30px;
  font-size:12px; letter-spacing:3px; z-index:20;
}

/* Side menu */
.menu {
  position:fixed; top:100px; left:30px; line-height:2;
}
.menu div { opacity:0.6; cursor:pointer; }
.menu div:hover { opacity:1; }

/* Sections */
.section {
  min-height:100vh; padding:140px 20px 60px;
  max-width:1100px; margin:auto; opacity:0;
}

.video {
  position:relative; padding-top:56.25%; margin-bottom:120px;
}
.video iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }

.contact { text-align:center; padding:160px 20px; opacity:0.6; }
</style>
</head>

<body>

<div class="preloader"><h1>REC702</h1></div>
<div class="cursor"></div>

<div class="header">
  <div>REC702</div>
  <div>TIAGO FANTIN</div>
</div>

<div class="menu">
  <div onclick="scrollToSection('elopements')">+ Elopements</div>
  <div onclick="scrollToSection('interviews')">+ Interviews</div>
  <div onclick="scrollToSection('ufc')">+ UFC Athletes</div>
</div>

<!-- Sections -->
<section id="elopements" class="section">
  <h2>Elopements</h2>
  <div class="video"><iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?controls=0&modestbranding=1&rel=0"></iframe></div>
</section>

<section id="interviews" class="section">
  <h2>Interviews</h2>
  <div class="video"><iframe src="https://www.youtube.com/embed/0fXs1QS92Cg?controls=0&modestbranding=1&rel=0"></iframe></div>
</section>

<section id="ufc" class="section">
  <h2>UFC Athletes</h2>
  <div class="video"><iframe src="https://www.youtube.com/embed/029TflxhHUc?controls=0&modestbranding=1&rel=0"></iframe></div>
</section>

<section class="contact">
  <h2>CONTACT</h2>
  <p>Tiagofantinlv@gmail.com</p>
</section>

<script>
// Scroll function
function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

// Cursor
const cursor = document.querySelector(".cursor");
window.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

// Lenis
const lenis = new Lenis();
function raf(t){ lenis.raf(t); requestAnimationFrame(raf); }
requestAnimationFrame(raf);

// Preloader animation
gsap.to(".preloader h1",{opacity:1, duration:1});
gsap.to(".preloader",{opacity:0, delay:1.5, duration:1, onComplete:()=>{
  document.body.style.overflow="auto";
  document.querySelector(".preloader").remove();
}});

// Reveal sections
gsap.utils.toArray(".section").forEach(sec=>{
  gsap.to(sec,{opacity:1, duration:1.4, scrollTrigger:{trigger:sec, start:"top 80%"}});
});
</script>

</body>
</html>
