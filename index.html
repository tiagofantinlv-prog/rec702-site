
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REC702 — Tiago Fantin</title>

<style>
body { margin:0; font-family: Arial, sans-serif; background:#000; color:#fff; }

/* Header */
.header {
  position:fixed; top:0; width:100%; padding:20px 30px;
  font-size:12px; letter-spacing:3px; z-index:20;
}

/* Combined logo */
.logo { font-weight:600; }

/* Side menu */
.menu {
  position:fixed; top:100px; left:30px; line-height:2;
}
.menu div { opacity:0.6; cursor:pointer; transition:opacity .3s, transform .3s; }
.menu div:hover { opacity:1; transform:translateX(4px); }

/* Sections */
.section {
  min-height:100vh; padding:140px 20px 60px;
  max-width:1100px; margin:auto;
}

.video {
  position:relative; padding-top:56.25%; margin-bottom:120px;
  transition: transform .4s ease, filter .4s ease;
}
.video:hover { transform:scale(1.02); filter:brightness(1.2); }

.video iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }

.contact { text-align:center; padding:160px 20px; opacity:0.6; }
</style>
</head>

<body>

<div class="header">
  <div class="logo">REC702 — TIAGO FANTIN</div>
</div>

<div class="menu">
  <div onclick="scrollToSection('elopements')" onmouseenter="playHover()">+ Elopements</div>
  <div onclick="scrollToSection('interviews')" onmouseenter="playHover()">+ Interviews</div>
  <div onclick="scrollToSection('ufc')" onmouseenter="playHover()">+ UFC Athletes</div>
</div>

<!-- Sections -->
<section id="elopements" class="section">
  <h2>Elopements</h2>
  <div class="video"><iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?controls=0&modestbranding=1&rel=0"></iframe></div>
</section>

<section id="interviews" class="section">
  <h2>Interviews</h2>
  <div class="video"><iframe src="https://www.youtube.com/embed/0fXs1QS92Cg?controls=0&modestbranding=1&rel=0"></iframe></div>
</section>

<section id="ufc" class="section">
  <h2>UFC Athletes</h2>
  <div class="video"><iframe src="https://www.youtube.com/embed/029TflxhHUc?controls=0&modestbranding=1&rel=0"></iframe></div>
</section>

<section class="contact">
  <h2>CONTACT</h2>
  <p>Tiagofantinlv@gmail.com</p>
</section>

<!-- Subtle hover sound -->
<audio id="hoverSound" preload="auto">
  <source src="https://cdn.jsdelivr.net/gh/terkelg/experiments/audio/click.mp3" type="audio/mpeg">
</audio>

<script>
function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

function playHover(){
  const s = document.getElementById("hoverSound");
  if(!s) return;
  s.currentTime = 0;
  s.volume = 0.2;
  s.play().catch(()=>{});
}
</script>

</body>
</html>
