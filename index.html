<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rec702 — Tiago Fantin</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #f5f5f5;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 1000;
    }

    .logo { font-weight: 300; letter-spacing: 2px; font-size: 14px; }

    nav a {
      margin-left: 28px;
      text-decoration: none;
      color: #ccc;
      font-size: 13px;
      font-weight: 300;
      transition: opacity 0.3s ease;
    }

    nav a:hover { opacity: 0.6; }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }

    .hero .rec {
      font-size: 14px;
      letter-spacing: 6px;
      margin-bottom: 12px;
      opacity: 0.7;
      font-weight: 300;
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 80px);
      font-weight: 300;
      letter-spacing: 1px;
    }

    .underline {
      width: 60px;
      height: 1px;
      background: #888;
      margin-top: 24px;
    }

    .videos {
      padding: 120px 6vw 100px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      max-width: 1600px;
      margin: auto;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #111;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      font-size: 12px;
      color: #777;
    }

    @media (max-width: 1200px) {
      .videos { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 700px) {
      .videos { grid-template-columns: 1fr; }
      header { padding: 20px 24px; }
      nav a { margin-left: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">rec702</div>
    <nav>
      <a href="#">Featured Work</a>
      <a href="#">Portfolio</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="rec">rec702</div>
    <h1>Tiago Fantin</h1>
    <div class="underline"></div>
  </section>

  <section class="videos">
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?controls=0&modestbranding=1&rel=0" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/0fXs1QS92Cg?controls=0&modestbranding=1&rel=0" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/029TflxhHUc?controls=0&modestbranding=1&rel=0" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/GSm1zmUqW6k?controls=0&modestbranding=1&rel=0" allowfullscreen></iframe></div>

    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/hDSKL7kzs6w" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/1CUKMSWwfe4" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/A4YEAEOD2Ng" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/Vk9rlGnPH5U" allowfullscreen></iframe></div>
  </section>

  <footer>
    © 2026 rec702 — Tiago Fantin. All rights reserved.
  </footer>
</body>
</html>
