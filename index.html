
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REC702</title>

<!-- GSAP for cinematic animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #000;
  color: #fff;
  overflow-x: hidden;
}

/* HEADER */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  text-align: center;
  padding: 20px;
  font-size: 12px;
  letter-spacing: 4px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
}

/* HERO */
.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120%;
  height: 120%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  filter: brightness(0.35);
}

.hero h1 {
  font-size: 70px;
  letter-spacing: 8px;
  font-weight: 300;
  z-index: 2;
  opacity: 0;
}

/* FILMS */
.section {
  max-width: 1100px;
  margin: auto;
  padding: 120px 20px;
}

.video {
  position: relative;
  padding-top: 56.25%;
  margin-bottom: 120px;
  opacity: 0;
  transform: translateY(60px);
}

.video iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* CONTACT */
.contact {
  text-align: center;
  padding: 140px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  opacity: 0;
}

.contact h2 {
  font-weight: 300;
  letter-spacing: 4px;
}

.contact a {
  display: block;
  margin-top: 20px;
  color: #fff;
  text-decoration: none;
  opacity: 0.7;
}

.contact a:hover { opacity: 1; }

.footer {
  text-align: center;
  font-size: 11px;
  opacity: 0.4;
  padding: 40px 0 60px;
}
</style>
</head>

<body>

<div class="header">REC702 — TIAGO FANTIN</div>

<section class="hero">
  <iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?autoplay=1&mute=1&controls=0&loop=1&playlist=gRxZIbfmBwc&modestbranding=1&rel=0"></iframe>
  <h1>DIRECTED BY TIAGO FANTIN</h1>
</section>

<section class="section">

  <div class="video"><iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video"><iframe src="https://www.youtube.com/embed/0fXs1QS92Cg?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video"><iframe src="https://www.youtube.com/embed/029TflxhHUc?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video"><iframe src="https://www.youtube.com/embed/GSm1zmUqW6k?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video"><iframe src="https://www.youtube.com/embed/hDSKL7kzs6w?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video"><iframe src="https://www.youtube.com/embed/1CUKMSWwfe4?controls=0&modestbranding=1&rel=0"></iframe></div>

</section>

<section class="contact">
  <h2>CONTACT</h2>
  <a href="mailto:Tiagofantinlv@gmail.com">Tiagofantinlv@gmail.com</a>
  <a href="https://instagram.com/tiagofantin" target="_blank">@tiagofantin</a>
</section>

<div class="footer">© 2026 REC702</div>

<script>
gsap.registerPlugin(ScrollTrigger);

// Hero title fade in
gsap.to(".hero h1", {opacity: 1, duration: 2, ease: "power2.out"});

// Videos reveal on scroll
gsap.utils.toArray(".video").forEach(video => {
  gsap.to(video, {
    opacity: 1,
    y: 0,
    duration: 1.4,
    ease: "power3.out",
    scrollTrigger: {
      trigger: video,
      start: "top 85%"
    }
  });
});

// Contact fade
gsap.to(".contact", {
  opacity: 1,
  duration: 1.5,
  scrollTrigger: {
    trigger: ".contact",
    start: "top 85%"
  }
});
</script>

</body>
</html>
