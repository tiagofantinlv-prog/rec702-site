
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REC702</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- Lenis -->
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #000;
  color: #fff;
  cursor: none;
}

/* Custom cursor */
.cursor {
  position: fixed;
  width: 18px;
  height: 18px;
  border: 1px solid #fff;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 9999;
}

/* Header */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 20px 30px;
  font-size: 12px;
  letter-spacing: 3px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
}

.logo {
  font-weight: 600;
}

.menu {
  position: fixed;
  top: 80px;
  left: 30px;
  font-size: 14px;
  line-height: 2;
  opacity: 0.7;
}

.menu div:hover {
  opacity: 1;
  cursor: pointer;
}

/* Hero */
.hero {
  position: relative;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120%;
  height: 120%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  filter: brightness(0.35);
}

.hero h1 {
  font-size: 70px;
  letter-spacing: 8px;
  font-weight: 300;
  opacity: 0;
  z-index: 2;
}

/* Section */
.section {
  max-width: 1100px;
  margin: auto;
  padding: 120px 20px;
}

.video {
  position: relative;
  padding-top: 56.25%;
  margin-bottom: 140px;
  opacity: 0;
  transform: translateY(80px);
}

.video iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* Contact */
.contact {
  text-align: center;
  padding: 160px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  opacity: 0;
}

.footer {
  text-align: center;
  font-size: 11px;
  opacity: 0.4;
  padding: 40px 0 60px;
}
</style>
</head>

<body>

<div class="cursor"></div>

<div class="header">
  <div class="logo">REC702</div>
  <div>TIAGO FANTIN</div>
</div>

<div class="menu">
  <div>+ Elopements</div>
  <div>+ Interviews</div>
  <div>+ UFC Athletes</div>
</div>

<section class="hero">
  <iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?autoplay=1&mute=1&controls=0&loop=1&playlist=gRxZIbfmBwc&modestbranding=1&rel=0"></iframe>
  <h1>DIRECTED BY TIAGO FANTIN</h1>
</section>

<section class="section">
  <div class="video"><iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video"><iframe src="https://www.youtube.com/embed/0fXs1QS92Cg?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video"><iframe src="https://www.youtube.com/embed/029TflxhHUc?controls=0&modestbranding=1&rel=0"></iframe></div>
</section>

<section class="contact">
  <h2>CONTACT</h2>
  <p>Tiagofantinlv@gmail.com</p>
</section>

<div class="footer">© 2026 REC702</div>

<script>
// Cursor
const cursor = document.querySelector(".cursor");
window.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

// Lenis
const lenis = new Lenis();
function raf(time) {
  lenis.raf(time);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

// GSAP
gsap.registerPlugin(ScrollTrigger);
gsap.to(".hero h1", { opacity: 1, duration: 2 });

gsap.utils.toArray(".video").forEach(video => {
  gsap.to(video, {
    opacity: 1,
    y: 0,
    duration: 1.4,
    scrollTrigger: { trigger: video, start: "top 85%" }
  });
});

gsap.to(".contact", {
  opacity: 1,
  duration: 1.5,
  scrollTrigger: { trigger: ".contact", start: "top 85%" }
});
</script>

</body>
</html>
