
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REC702</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- Lenis Smooth Scroll -->
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #000;
  color: #fff;
  overflow-x: hidden;
  cursor: none;
}

/* Custom cursor */
.cursor {
  position: fixed;
  width: 18px;
  height: 18px;
  border: 1px solid #fff;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: transform 0.15s ease, opacity 0.3s;
  z-index: 9999;
}

/* Header */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  text-align: center;
  padding: 20px;
  font-size: 12px;
  letter-spacing: 4px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
}

/* Hero */
.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120%;
  height: 120%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  filter: brightness(0.35);
}

.hero h1 {
  font-size: 70px;
  letter-spacing: 8px;
  font-weight: 300;
  z-index: 2;
  opacity: 0;
}

/* Section */
.section {
  max-width: 1100px;
  margin: auto;
  padding: 120px 20px;
}

/* Video */
.video {
  position: relative;
  padding-top: 56.25%;
  margin-bottom: 140px;
  opacity: 0;
  transform: translateY(80px);
}

.video iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* Parallax effect */
.parallax {
  transform: translateY(0px);
}

/* Contact */
.contact {
  text-align: center;
  padding: 160px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  opacity: 0;
}

.contact h2 {
  font-weight: 300;
  letter-spacing: 4px;
}

.contact a {
  display: block;
  margin-top: 20px;
  color: #fff;
  text-decoration: none;
  opacity: 0.7;
}

.footer {
  text-align: center;
  font-size: 11px;
  opacity: 0.4;
  padding: 40px 0 60px;
}
</style>
</head>

<body>

<div class="cursor"></div>
<div class="header">REC702 — TIAGO FANTIN</div>

<section class="hero">
  <iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?autoplay=1&mute=1&controls=0&loop=1&playlist=gRxZIbfmBwc&modestbranding=1&rel=0"></iframe>
  <h1>DIRECTED BY TIAGO FANTIN</h1>
</section>

<section class="section">

  <div class="video parallax"><iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video parallax"><iframe src="https://www.youtube.com/embed/0fXs1QS92Cg?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video parallax"><iframe src="https://www.youtube.com/embed/029TflxhHUc?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video parallax"><iframe src="https://www.youtube.com/embed/GSm1zmUqW6k?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video parallax"><iframe src="https://www.youtube.com/embed/hDSKL7kzs6w?controls=0&modestbranding=1&rel=0"></iframe></div>
  <div class="video parallax"><iframe src="https://www.youtube.com/embed/1CUKMSWwfe4?controls=0&modestbranding=1&rel=0"></iframe></div>

</section>

<section class="contact">
  <h2>CONTACT</h2>
  <a href="mailto:Tiagofantinlv@gmail.com">Tiagofantinlv@gmail.com</a>
  <a href="https://instagram.com/tiagofantin" target="_blank">@tiagofantin</a>
</section>

<div class="footer">© 2026 REC702</div>

<script>
// Custom cursor
const cursor = document.querySelector(".cursor");
window.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

// Lenis smooth scroll
const lenis = new Lenis({ smooth: true });
function raf(time) {
  lenis.raf(time);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

// GSAP animations
gsap.registerPlugin(ScrollTrigger);

gsap.to(".hero h1", { opacity: 1, duration: 2 });

gsap.utils.toArray(".video").forEach((video, i) => {
  gsap.to(video, {
    opacity: 1,
    y: 0,
    duration: 1.4,
    ease: "power3.out",
    scrollTrigger: { trigger: video, start: "top 85%" }
  });

  gsap.to(video, {
    y: -80,
    scrollTrigger: {
      trigger: video,
      scrub: true
    }
  });
});

gsap.to(".contact", {
  opacity: 1,
  duration: 1.5,
  scrollTrigger: { trigger: ".contact", start: "top 85%" }
});
</script>

</body>
</html>
