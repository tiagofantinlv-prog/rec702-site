<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rec702 — Tiago Fantin</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #f5f5f5;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    /* subtle film grain */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.05;
      pointer-events: none;
      z-index: 9999;
    }

    /* custom cursor */
    .cursor {
      width: 18px;
      height: 18px;
      border: 1px solid #aaa;
      border-radius: 50%;
      position: fixed;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10000;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .cursor.hover {
      transform: translate(-50%, -50%) scale(1.8);
      opacity: 0.6;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 1000;
    }

    .logo { font-weight: 300; letter-spacing: 2px; font-size: 14px; }

    nav a {
      margin-left: 28px;
      text-decoration: none;
      color: #ccc;
      font-size: 13px;
      font-weight: 300;
      transition: opacity 0.3s ease;
    }

    nav a:hover { opacity: 0.6; }

    .hero {
      height: 70vh;
      padding-top: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }

    .hero .rec {
      font-size: 14px;
      letter-spacing: 6px;
      margin-bottom: 12px;
      opacity: 0;
      font-weight: 300;
      animation: fadeUp 1.2s ease forwards;
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 80px);
      font-weight: 300;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards;
      animation-delay: 0.2s;
    }

    .underline {
      width: 60px;
      height: 1px;
      background: #888;
      margin-top: 24px;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards;
      animation-delay: 0.4s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .videos {
      padding: 120px 6vw 100px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      max-width: 1400px;
      margin: auto;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #111;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    .video-wrapper:hover {
      transform: scale(1.04);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      font-size: 12px;
      color: #777;
    }

    @media (max-width: 700px) {
      body { cursor: auto; }
      .cursor { display: none; }
      .videos { grid-template-columns: 1fr; }
      header { padding: 20px 24px; }
      nav a { margin-left: 16px; }
    }
  </style>
</head>

<body>

  <div class="cursor" id="cursor"></div>

  <header>
    <div class="logo">rec702</div>
    <nav>
      <a href="#">Featured Work</a>
      <a href="#">Portfolio</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="rec">rec702</div>
    <h1>Tiago Fantin</h1>
    <div class="underline"></div>
  </section>

  <section class="videos">

    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?controls=0&modestbranding=1&rel=0" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/0fXs1QS92Cg?controls=0&modestbranding=1&rel=0" allowfullscreen></iframe></div>

    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/029TflxhHUc?controls=0&modestbranding=1&rel=0" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/GSm1zmUqW6k?controls=0&modestbranding=1&rel=0" allowfullscreen></iframe></div>

    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/hDSKL7kzs6w" allowfullscreen></iframe></div>
    <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/1CUKMSWwfe4" allowfullscreen></iframe></div>

  </section>

  <footer>
    © 2026 rec702 — Tiago Fantin. All rights reserved.
  </footer>

  <script>
    const cursor = document.getElementById('cursor');

    window.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    document.querySelectorAll('a, .video-wrapper').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });
  </script>

</body>
</html>
