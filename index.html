
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REC702 — Tiago Fantin</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* Header */
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 20px 30px;
  font-size: 12px;
  letter-spacing: 3px;
  z-index: 50;
}

/* Layered grid container */
.grid {
  position: relative;
  height: 200vh;
  margin-top: 120px;
}

/* Floating video blocks */
.block {
  position: absolute;
  width: 38vw;
  aspect-ratio: 16/9;
  overflow: hidden;
  transform: scale(0.95);
  transition: transform 0.6s ease, filter 0.6s ease;
}

.block iframe {
  width: 100%;
  height: 100%;
  border: none;
  pointer-events: none;
  filter: brightness(0.85);
}

.block:hover {
  transform: scale(1);
  filter: brightness(1.1);
  z-index: 10;
}

/* Positions similar to Wanda feel */
.b1 { top: 0; left: 5vw; }
.b2 { top: 20vh; right: 5vw; width: 30vw; }
.b3 { top: 80vh; left: 10vw; width: 45vw; }
.b4 { top: 110vh; right: 8vw; width: 32vw; }

/* Contact */
.contact {
  text-align: center;
  padding: 160px 20px 80px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="header">REC702 — TIAGO FANTIN</div>

<section class="grid">

  <div class="block b1">
    <iframe src="https://www.youtube.com/embed/gRxZIbfmBwc?controls=0&modestbranding=1&rel=0"></iframe>
  </div>

  <div class="block b2">
    <iframe src="https://www.youtube.com/embed/0fXs1QS92Cg?controls=0&modestbranding=1&rel=0"></iframe>
  </div>

  <div class="block b3">
    <iframe src="https://www.youtube.com/embed/029TflxhHUc?controls=0&modestbranding=1&rel=0"></iframe>
  </div>

  <div class="block b4">
    <iframe src="https://www.youtube.com/embed/GSm1zmUqW6k?controls=0&modestbranding=1&rel=0"></iframe>
  </div>

</section>

<section class="contact">
  <h2>CONTACT</h2>
  <p>tiagofantinlv@gmail.com</p>
</section>

<script>
gsap.registerPlugin(ScrollTrigger);

gsap.utils.toArray(".block").forEach((el, i) => {
  gsap.to(el, {
    y: i % 2 === 0 ? -120 : -80,
    ease: "none",
    scrollTrigger: {
      trigger: ".grid",
      start: "top bottom",
      end: "bottom top",
      scrub: true
    }
  });
});
</script>

</body>
</html>
